<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Dialogue Detector</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>AI Dialogue <span>Detector</span></h1>
            <p>Pinpoint exact video frames using multi-modal ASR & OCR</p>
        </header>

        <section class="card url-section">
            <h2>1. Load Video</h2>
            <div class="input-group" style="margin-bottom: 10px;">
                <select id="video-select" class="primary-btn" style="background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.8rem; border-radius: 8px; width: 100%; cursor: pointer;">
                    <option value="" style="color: black;">Select a cached video...</option>
                </select>
            </div>
            <p style="text-align: center; color: rgba(255, 255, 255, 0.6); margin: 5px 0;">OR</p>
            <div class="input-group">
                <input type="text" id="video-url" placeholder="Paste YouTube or OK.ru URL here..." />
                <button id="load-btn" class="primary-btn">Download & Cache</button>
            </div>
            <div id="load-status" class="status-msg"></div>
        </section>

        <section class="card search-section" id="search-section">
            <h2>2. Search Target Phrase</h2>
            <div class="input-group">
                <input type="text" id="search-text" placeholder="e.g. My mind rebels at stagnation" />
            </div>
            <div class="input-group" style="margin-top: 10px;">
                <select id="search-mode" class="primary-btn" style="background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;">
                    <option value="asr_only" style="color: black;">ASR Only</option>
                    <option value="asr_ocr" style="color: black;">ASR + OCR (Fine)</option>
                    <option value="ocr_only" style="color: black;">OCR Only</option>
                </select>
                <button id="search-btn" class="primary-btn">Run AI Pipeline</button>
            </div>
            <div id="search-status" class="status-msg"></div>
        </section>

        <section class="card result-section hidden" id="result-section">
            <h2>Extraction Result</h2>
            <div class="result-content">
                <div class="result-details">
                    <div class="metric" id="metric-status">
                        <span class="label">Status</span>
                        <span class="value highlight" id="res-status">FOUND</span>
                    </div>
                    <div class="metric" id="metric-time">
                        <span class="label">Timestamp</span>
                        <span class="value" id="res-time">00:00:21.610</span>
                    </div>
                    <div class="metric" id="metric-frame">
                        <span class="label">Frame</span>
                        <span class="value" id="res-frame">0</span>
                    </div>
                    <div class="metric" id="metric-conf">
                        <span class="label">Confidence</span>
                        <span class="value" id="res-conf">100%</span>
                    </div>
                    <div class="metric full-width" id="metric-text">
                        <span class="label">Matched Text</span>
                        <span class="value text-quote" id="res-text">"breathing in your dust"</span>
                    </div>
                </div>
                <div class="result-image">
                    <img id="res-img" src="" alt="Extracted Frame" />
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
